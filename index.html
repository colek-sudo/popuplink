<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Windows Security Alert</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #000;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            background: #f0f0f0;
            border: 2px solid #000;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.8);
            padding: 0;
            z-index: 9999;
        }
        .title-bar {
            background: #000080;
            color: white;
            padding: 5px 10px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            cursor: move;
        }
        .content {
            padding: 20px;
            text-align: center;
            background: white;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        button {
            padding: 8px 25px;
            margin: 10px 5px;
            font-size: 14px;
            cursor: pointer;
        }
        .red-btn {
            background: #c00;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

<div class="popup">
    <div class="title-bar">
        <span>Windows Defender - Critical Alert</span>
        <span>×</span>
    </div>
    <div class="content">
        <div class="icon">⚠️</div>
        <h2 style="color:#c00;">Critical System Alert</h2>
        <p><strong>Your computer is infected with a virus!</strong></p>
        <p>Windows has detected suspicious activity.<br>
        Immediate action is required.</p>
        
        <button onclick="fakeShutdown()" class="red-btn">Scan and Fix Now</button>
        <button onclick="alert('Access Denied')">Ignore</button>
    </div>
</div>

<script>
    function fakeShutdown() {
        alert("🔄 Scanning system...\n\nThis may take several minutes.");
        setTimeout(() => {
            alert("❌ Unable to remove threat!\n\nSystem will shut down in 10 seconds to prevent damage.");
            setTimeout(() => {
                document.body.innerHTML = `
                    <div style="background:#0000aa;color:white;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:Segoe UI;">
                        <h1>A problem has been detected and Windows has been shut down to prevent damage.</h1>
                        <p style="margin-top:30px;">Your PC ran into a problem and needs to restart.</p>
                    </div>`;
            }, 800);
        }, 1200);
    }

    // Extra annoying popups
    setTimeout(() => {
        alert("Windows Security Center\n\nVirus detected: Trojan.Generic.123456");
    }, 1500);
</script>

</body>
</html>
