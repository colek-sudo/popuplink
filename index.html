<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Your Free Gift 🎁</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            height: 100vh;
            cursor: none; /* hides cursor for extra chaos */
        }
        img {
            position: absolute;
            border: 6px solid #fff;
            box-shadow: 0 0 30px #ff00ff, 0 0 60px #00ffff;
            user-select: none;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>
    <h1 style="color:#ff00ff; text-align:center; font-family:Impact; font-size:3rem; position:relative; z-index:1000; text-shadow: 0 0 20px #fff;">
        😈
    </h1>

    <script>
        // ================== CHANGE THIS URL TO YOUR PHOTO ==================
        const YOUR_IMAGE = "https://picsum.photos/id/237/800/600";   // ←←← PUT YOUR PHOTO LINK HERE

        function createChaosPhoto() {
            const img = document.createElement('img');
            img.src = YOUR_IMAGE;
            
            const size = 120 + Math.random() * 280; // big photos
            img.style.width = size + 'px';
            img.style.left = Math.random() * 100 + 'vw';
            img.style.top = Math.random() * 100 + 'vh';
            img.style.transform = `rotate(${Math.random()*720 - 360}deg)`;
            
            // Random fast animation
            const duration = 1.5 + Math.random() * 3;
            img.style.transition = `all ${duration}s linear`;
            
            document.body.appendChild(img);

            // Make them fly around
            setTimeout(() => {
                img.style.left = Math.random() * 100 + 'vw';
                img.style.top = Math.random() * 100 + 'vh';
                img.style.transform = `rotate(${Math.random()*1440 - 720}deg)`;
            }, 50);

            // Remove after a while
            setTimeout(() => img.remove(), 12000);
        }

        // SUPER AGGRESSIVE spawning
        setInterval(() => {
            for(let i = 0; i < 6; i++) {     // spawns 6 at a time
                createChaosPhoto();
            }
        }, 60);   // every 60ms → extremely fast

        // Extra burst on clicks
        document.addEventListener('click', () => {
            for(let i = 0; i < 15; i++) {
                createChaosPhoto();
            }
        });

        // Try to force fullscreen immediately
        setTimeout(() => {
            document.documentElement.requestFullscreen().catch(() => {});
        }, 800);

        // Warning message that follows mouse
        const warning = document.createElement('div');
        warning.innerHTML = "STOP TRYING TO CLOSE THIS 😭";
        warning.style.position = "fixed";
        warning.style.color = "red";
        warning.style.fontSize = "2rem";
        warning.style.fontFamily = "Impact";
        warning.style.pointerEvents = "none";
        warning.style.zIndex = "10000";
        warning.style.textShadow = "0 0 15px white";
        document.body.appendChild(warning);

        document.addEventListener('mousemove', (e) => {
            warning.style.left = (e.clientX + 20) + 'px';
            warning.style.top = (e.clientY + 20) + 'px';
        });
    </script>
</body>
</html>
